[package]
name = "sesame"
version = "0.1.0"
description = "Sesame —— 轻量文本编辑器与文件查看器"
authors = ["Sesame"]
edition = "2021"
# Tauri 2 官方插件当前要求 Rust >= 1.90
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sesame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# 剪贴板读写走 Rust 而不是浏览器的 navigator.clipboard。
#
# 浏览器的剪贴板权限是**为网页设计的**：网页不可信，所以要用户授权。
# 桌面应用没有这个前提——用户自己装的软件，读剪贴板就是读自己的剪贴板。
# 用它会让「粘贴」变成一个会弹权限框的操作，而这是编辑器里最基本的动作。
tauri-plugin-clipboard-manager = "2"
# 单实例：再次打开文件时复用已有窗口，而不是起第二个进程。
# 没有它的话，双击第二个文件会启动第二个 Sesame，
# 两个进程同时读写 settings.json / session.json 会互相覆盖。
tauri-plugin-single-instance = "2"
# 曾经用 tauri-plugin-window-state 记住窗口位置与大小，已移除。
# 现在每次启动都是固定 900×900 居中：用户临时挪一下窗口，
# 下次打开却出现在别处、大小也不同，反而像是「没按预期启动」。
# 移除后 `visible: false` 的窗口需要自己 show()，见 lib.rs。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
base64 = "0.22"
# 枚举系统已安装字体。纯 Rust 实现（含 fontconfig 解析），
# 不需要链接系统库，也不引入平台特定代码。
fontdb = "0.24"

# 关闭 WebView2 的浏览器快捷键（Ctrl+F 查找栏、Ctrl+P 打印等）。
# 这两个 crate 已经是 wry 的间接依赖，这里显式声明以便直接调用其接口；
# 版本必须与 Cargo.lock 中 wry 使用的一致，否则类型不兼容。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

[lints.rust]
# MSVC 在生成 cdylib 时会打印「正在创建库 …dll.lib 和对象 …dll.exp」，
# 这是链接器的正常输出，不是问题。crate-type 里的 cdylib 是 Tauri 移动端
# 构建所需，桌面开发时它只会让每次 `tauri dev` 都刷一条无意义的警告，
# 因此在这里显式关闭该 lint。
linker_messages = "allow"
