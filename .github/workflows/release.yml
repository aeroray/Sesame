name: Release

# 推送 v 开头的 SemVer 标签（例如 v0.2.0）即可构建并发布安装包。
# 同一个 Release 里还会带上签名过的自动更新产物与 latest.json，
# Windows 与 macOS 客户端都据此检查更新。
#
# 也可以手动触发并填一个**已存在**的标签来重新发布，无需再推标签。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 SemVer 标签，例如 v1.0.0"
        required: true
        type: string

# tauri-action 需要写权限来创建 Release 并上传产物
permissions:
  contents: write

jobs:
  release:
    strategy:
      # 一个平台失败不要取消另一个——否则 Windows 成功、macOS 失败时，
      # 已经构建好的 Windows 包也不会被上传，而 latest.json 缺少
      # darwin 条目其实仍可发布（Windows 客户端照常更新）。
      fail-fast: false
      matrix:
        include:
          # Windows：只出 NSIS 安装包。
          # 不带 --target，即宿主默认的 x64。
          - platform: windows-latest
            args: "--config .github/tauri-release.conf.json --bundles nsis"

          # macOS：Apple Silicon（aarch64）的 app + dmg。
          #
          # 为什么两个都要：
          # - dmg 是给用户下载的安装镜像
          # - app 是自动更新产物的来源（macOS 的更新包是 .app.tar.gz，
          #   不是 dmg）
          #
          # 只出 arm64 是刻意的：Intel Mac 已停产多年，
          # 多一个 universal 目标会让构建时间与产物体积翻倍。
          - platform: macos-latest
            args: "--config .github/tauri-release.conf.json --target aarch64-apple-darwin --bundles app,dmg"

    runs-on: ${{ matrix.platform }}

    # 发布环境的门禁位。
    #
    # 首次使用时 GitHub 会自动创建名为 `release` 的环境（默认无规则，
    # 行为与不加这一行相同）。在仓库 Settings > Environments 里给它配上
    # 「Required reviewers」或「限制可部署分支」之后，这一步就成了人工门禁——
    # 不必再改 workflow。标签本身不受分支保护约束，因此这道门禁是
    # 「一次误推标签不会立刻对全体用户生效」的最后一道保险。
    environment: release

    steps:
      # 所有第三方 action 一律固定到**完整提交 SHA**。
      #
      # 这个 job 手里有 `contents: write` 和更新签名私钥：一个被上游
      # 重新指向的 tag（账号被盗、仓库易主、恶意发布）就能在这里执行任意
      # 代码，读走私钥并发布一个客户端会静默安装的「更新」。浮动 tag
      # （`@v4`、`@stable`）意味着同一份 workflow 在不同时间跑的是不同代码，
      # 事后也无法证明发布产物对应哪一份 action 源码。
      #
      # 升级时改 SHA 并在注释里同步版本号；建议开启 Dependabot 的
      # github-actions 生态，让升级变成可审查的 PR。
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # 需要完整历史才能验证标签提交确实在 main 上（见下方步骤）
          fetch-depth: 0

      # pnpm 必须在 setup-node 之前安装，否则 setup-node 的
      # `cache: pnpm` 找不到 pnpm 而无法定位缓存目录。
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # 版本由 rust-toolchain 决定；这里只需要 stable。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Add Apple Silicon target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      # Cargo 工作区在 src-tauri 而不是仓库根，必须显式指定，
      # 否则缓存路径算错、每次都全量重编（约 10 分钟）。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 拒绝「标签指向的提交不在 main 上」的发布。
      #
      # 标签不受分支保护约束：能推标签的人未必能推 main。一个指向未合并
      # 分支的标签会直接产出一个已签名、非草稿、客户端立即升级的版本。
      # 这里要求标签提交必须是 origin/main 的祖先。
      - name: Ensure the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      # 校验标签与 package.json / Cargo.toml 一致，且 tauri.conf.json
      # 仍指向 package.json 而不是写死版本号。
      #
      # 不一致就直接失败——标签与内部版本不符会发布出「检查更新永远
      # 认为已是最新」的包，那种问题在用户端很难查。
      #
      # 带 --check：CI 里只读不写。若让它顺手改文件，仓库里就会出现
      # 未提交的改动，「构建产物对应哪个提交」随之说不清。
      #
      # 标签经 `env:` 传入再在 shell 里展开，**不要**直接把
      # `${{ inputs.tag || github.ref_name }}` 写进 run 行：那是把
      # 用户可控的字符串拼进 shell 脚本，双引号挡不住 `$(...)`、反引号、
      # `;` 和 `&`——git 允许 `v1.0.0$(id)` 这样的标签名。脚本里的校验
      # 发生在 shell 已经解析完这一行之后，来不及。
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/version.mjs --check "$RELEASE_TAG"

      # 生成 .github/tauri-release.conf.json，把更新源指向当前仓库。
      # 该文件不入库（见 .gitignore），因为它是按 CI 环境推导出来的。
      - name: Configure updater endpoint
        run: node scripts/prepare-release-config.mjs

      # 更新说明来自 docs/releases/<tag>.md。缺失或为空会让这一步失败，
      # 这是刻意的：宁可发不出去，也不要发一个没有说明的版本。
      #
      # 与上一步同理：标签走 `env:` 而不是直接拼进 run 行。
      - name: Load release notes
        id: notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/load-release-notes.mjs "$RELEASE_TAG"

      - name: Build and publish release
        # 固定到 v1 的具体提交，而不是用 @v0 / @v1 这类浮动标签：
        # 标签会被上游移动，同一份 workflow 在不同时间可能跑到不同代码。
        # 这个 SHA 是另一个项目（SkillSage）在用的、已验证可用的 v1。
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新产物的 minisign 私钥。没有它就不会有 .sig 文件与
          # latest.json，客户端也就永远收不到更新。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Sesame ${{ inputs.tag || github.ref_name }}"
          # 说明来自 docs/releases/<tag>.md（上一步读取）
          releaseBody: ${{ steps.notes.outputs.body }}
          # 关掉自动生成：它可能把一段自动的提交列表插到我们写好的
          # 说明前面，而那份说明是给人读的
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          # 汇总各平台产物、生成并上传 latest.json（自动更新的清单）。
          #
          # 注意参数名：tauri-action v1 把旧的 `includeUpdaterJson`
          # 改名成了 `uploadUpdaterJson`。传旧名字**不会报错**，
          # 只是被忽略，结果是 Release 里没有 latest.json——
          # 所有已安装的客户端会永远显示「已是最新」，且没有任何提示。
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
